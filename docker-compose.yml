# Full in-house deployment: API + TimescaleDB together.
# On the company server/infra:  docker compose up -d
# The API continuously reads the ADS-B receiver and saves every update
# into TimescaleDB (runs in its own container). Nothing is lost on refresh.

services:
  # --- TimescaleDB: official image, stores all time-series data in-house ---
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: adsb-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adsb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-adsb}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - adsb_pgdata:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adsb} -d ${POSTGRES_DB:-adsb}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # --- ADS-B API: reads receiver, decodes, saves to TimescaleDB, serves REST/WS ---
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: adsb-api
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
      # URM-01/02 Drone RID heartbeat UDP stream (Ethernet path).
      - "${RID_UDP_PORT:-65100}:${RID_UDP_PORT:-65100}/udp"
      # AIS112E-A ground station pushes AIVDM datagrams here (network/4G path).
      - "${AIS_UDP_PORT:-65110}:${AIS_UDP_PORT:-65110}/udp"
    environment:
      # Point the API at the TimescaleDB container (service name = hostname).
      DATABASE_URL: postgres://${POSTGRES_USER:-adsb}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB:-adsb}
      USE_MOCK: ${USE_MOCK:-false}
      TCP_HOST: ${TCP_HOST:?ADSR-800/serial-bridge IP (e.g. 192.168.0.7)}
      TCP_PORT: ${TCP_PORT:-8235}
      RECEIVER_LAT: ${RECEIVER_LAT:-52}
      RECEIVER_LON: ${RECEIVER_LON:-4}
      # --- Drone Remote ID (URM-01/02) ---
      RID_USE_MOCK: ${RID_USE_MOCK:-false}
      RID_TRANSPORT: ${RID_TRANSPORT:-dual}
      RID_UDP_HOST: ${RID_UDP_HOST:-0.0.0.0}
      RID_UDP_PORT: ${RID_UDP_PORT:-65100}
      RID_SERIAL_PORT: ${RID_SERIAL_PORT:-/dev/ttyUSB0}
      RID_SERIAL_BAUD: ${RID_SERIAL_BAUD:-115200}
      RID_STALE_MS: ${RID_STALE_MS:-15000}
      RID_EVICT_MS: ${RID_EVICT_MS:-60000}
      RID_SCAN_MS: ${RID_SCAN_MS:-10000}
      # --- AIS Maritime (AERA Sentinel FST-1 VHF receiver) ---
      AIS_USE_MOCK: ${AIS_USE_MOCK:-true}
      AIS_TRANSPORT: ${AIS_TRANSPORT:-serial}
      AIS_MOCK_TICK_MS: ${AIS_MOCK_TICK_MS:-2000}
      AIS_SERIAL_PORT: ${AIS_SERIAL_PORT:-/dev/ttyUSB1}
      AIS_SERIAL_BAUD: ${AIS_SERIAL_BAUD:-38400}
      AIS_UDP_HOST: ${AIS_UDP_HOST:-0.0.0.0}
      AIS_UDP_PORT: ${AIS_UDP_PORT:-65110}
      AIS_TCP_HOST: ${AIS_TCP_HOST:-192.168.0.8}
      AIS_TCP_PORT: ${AIS_TCP_PORT:-8236}
      AIS_TCP_RECONNECT_MS: ${AIS_TCP_RECONNECT_MS:-1000}
      AIS_STALE_MS: ${AIS_STALE_MS:-300000}
      AIS_EVICT_MS: ${AIS_EVICT_MS:-1800000}
      AIS_SCAN_MS: ${AIS_SCAN_MS:-15000}
    # The API needs to reach the receiver on the LAN. If the receiver is on the
    # host's network, allow it. Add ports for a serial device if needed.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  adsb_pgdata:
